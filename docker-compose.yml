# Local run in a container: docker compose up --build → http://localhost:8089, Qdrant dashboard → http://localhost:6333/dashboard
# Keys come from .env. The Telegram bot is OFF here on purpose: a bot token may be polled by one process only,
# and the production bot runs on Railway. Remove the TELEGRAM_BOT_TOKEN override to run the bot locally instead.
# Vectors live in the Qdrant server here; without QDRANT_URL the service falls back to embedded Qdrant in /data.
services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
  coach:
    build: .
    env_file: .env
    depends_on:
      - qdrant
    environment:
      AI_DATA_DIR: /data
      PORT: "8089"
      QDRANT_URL: http://qdrant:6333
      TELEGRAM_BOT_TOKEN: ""
      CORS_ORIGINS: http://localhost:8089,http://localhost:5173
    ports:
      - "8089:8089"
    volumes:
      - coach_data:/data
volumes:
  coach_data:
  qdrant_data:
